spring.application.name=ai-medical-assistant
server.port=8080

# Default database: H2, so the project runs without installing MySQL.
spring.datasource.url=jdbc:h2:file:./data/medicaldb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# To use MySQL, replace the datasource values with:
# spring.datasource.url=jdbc:mysql://localhost:3306/medical_assistant
# spring.datasource.username=root
# spring.datasource.password=YOUR_PASSWORD

app.jwt.secret=${JWT_SECRET:change-this-development-secret}
app.jwt.expiration=86400000

# Optional Gemini API key. If empty, the app uses a safe demo response.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash
